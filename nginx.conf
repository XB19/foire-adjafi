server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # React Router: let the SPA handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|otf|ttf|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
